    <h2>HOBBIES</h2>

    <div class="hobbies-grid">
        <figure class="hobby-item">
            <img src="images/hobby1.png" alt="READING" class="image-circle">
            <div class="bio-text"><p>Currently deep in Pema Chödrön’s When Things Fall Apart, Hope finds resonance in the invitation to sit with uncertainty and find stability in the very ground of being. The book’s teachings on facing life’s instability directly inform their artistic philosophy of finding clarity and strength within organized chaos.</p>
        </figure>

        <figure class="hobby-item">
            <img src="images/hobby2.png" alt="YOGA" class="image-circle">
            Mornings begin on the mat, where breath and posture build the physical stamina and mental steadiness that everything else demands. It's the quiet discipline that makes the chaos of creation sustainable.
        </figure>

        <figure class="hobby-item">
            <img src="images/hobby3.png" alt="TAROT" class="image-circle">
            On the side, Hope offers tarot readings as an extension of the same impulse behind their art: holding up a mirror so people feel seen. The cards serve as a prompt for storytelling, with each client writing the final meaning.
        </figure>
   
        <figure class="hobby-item">
            <img src="images/accomplishment1.png" alt="PAINTING" class="image-circle">
            Punchline, a work depicting the fine line between tragedy and comedy. Hope wields colour as a visceral language to reclaim space stolen by patriarchal violence and systemic indifference, turning canvas into an act of revelation about who benefits from silence. Each brushstroke is a refusal to be unseen and a way of saying I survived, and my story belongs here.
        </figure>

        <figure class="hobby-item">
            <img src="images/accomplishment2.jpg" alt="GARDENING" class="image-circle">
            Mulching beds layer by patient layer became one of Hope's grounding rituals in their work gardening. This shows that healing, like soil, needs protection and time before anything can properly grow. The slow, repetitive work mirrors how they rebuild themselves: quietly, season after season.
        </figure>

        <figure class="hobby-item">
            <img src="images/accomplishment3.png" alt="AERIAL" class="image-circle">
            Suspended on the aerial hoop, Hope trades control for trust, finding clarity in the exact moment fear turns into strength. Hanging upside down above the ground is where the noise stops and the body remembers what it can hold.
        </figure>
    </div>
